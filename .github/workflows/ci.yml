name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SIGNAL_ROOT: ${{ github.workspace }}/engines/signal
      ODDS_ROOT: ${{ github.workspace }}/engines/odds
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone quant engine repos
        run: |
          mkdir -p engines
          git clone --depth 1 https://github.com/RosarioM123/signal-research-lab.git engines/signal
          git clone --depth 1 https://github.com/RosarioM123/odds-prediction-mispricing.git engines/odds

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Smoke test MCP server startup
        run: |
          timeout 10 python -m server.main || code=$?
          if [ "$code" -ne 124 ]; then exit "$code"; fi
